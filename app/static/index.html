<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taiwan Travel Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: #1a1f2e;
      border-bottom: 1px solid #2d3748;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .subtitle {
      font-size: 12px;
      color: #718096;
    }
    header .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid #4a5568;
      color: #a0aec0;
    }

    /* ── Main Layout ── */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left Panel: Chat ── */
    .chat-panel {
      width: 480px;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2d3748;
      background: #141820;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Pipeline Status ── */
    .pipeline-card {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 14px;
    }
    .pipeline-card .title {
      font-size: 11px;
      font-weight: 600;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .pipeline-steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      transition: all 0.3s ease;
      color: #4a5568;
    }
    .step .icon { font-size: 14px; width: 20px; text-align: center; }
    .step .name { flex: 1; }
    .step .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #2d3748;
      transition: all 0.3s;
    }
    .step.running {
      background: rgba(102,126,234,0.1);
      color: #a0aec0;
    }
    .step.running .status-dot {
      background: #667eea;
      box-shadow: 0 0 6px #667eea;
      animation: pulse 1s infinite;
    }
    .step.done {
      color: #68d391;
    }
    .step.done .status-dot { background: #68d391; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Message Bubbles ── */
    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }

    .bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .message.assistant .bubble {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      color: #e2e8f0;
    }
    .message-time {
      font-size: 10px;
      color: #4a5568;
      padding: 0 4px;
    }

    /* ── Input Area ── */
    .input-area {
      padding: 16px;
      border-top: 1px solid #2d3748;
      background: #141820;
    }
    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #667eea;
    }
    textarea#userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    textarea#userInput::placeholder { color: #4a5568; }

    #sendBtn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #sendBtn:hover:not(:disabled) { opacity: 0.85; }

    /* ── Right Panel: Itinerary ── */
    .itinerary-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 24px;
      border-bottom: 1px solid #2d3748;
      background: #1a1f2e;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .panel-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .panel-header .state-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .state-badge.idle { background: #2d3748; color: #718096; }
    .state-badge.streaming { background: rgba(102,126,234,0.2); color: #667eea; }
    .state-badge.review { background: rgba(237,137,54,0.2); color: #ed8936; }
    .state-badge.approved { background: rgba(72,187,120,0.2); color: #48bb78; }

    .itinerary-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* 空白狀態 */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #4a5568;
      text-align: center;
    }
    .empty-state .big-icon { font-size: 48px; opacity: 0.5; }
    .empty-state p { font-size: 14px; max-width: 300px; line-height: 1.6; }
    .example-queries {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .example-chip {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      color: #a0aec0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .example-chip:hover {
      border-color: #667eea;
      color: #667eea;
    }

    /* 行程草稿 */
    .draft-container { display: flex; flex-direction: column; gap: 16px; }

    .draft-content {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 20px;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    /* HITL 審核區塊 */
    .review-panel {
      background: rgba(237,137,54,0.08);
      border: 1px solid rgba(237,137,54,0.3);
      border-radius: 12px;
      padding: 16px;
    }
    .review-panel .review-title {
      font-size: 13px;
      font-weight: 600;
      color: #ed8936;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .review-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-approve {
      background: linear-gradient(135deg, #48bb78, #38a169);
      color: white;
    }
    .btn-approve:hover { opacity: 0.85; }
    .btn-modify {
      background: #2d3748;
      color: #e2e8f0;
    }
    .btn-modify:hover { background: #3d4a5c; }

    .feedback-area {
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .feedback-area.visible { display: flex; }
    .feedback-area textarea {
      background: #0f1117;
      border: 1px solid #4a5568;
      border-radius: 8px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 13px;
      padding: 10px 12px;
      resize: vertical;
      min-height: 70px;
      outline: none;
    }
    .feedback-area textarea:focus { border-color: #667eea; }
    .btn-submit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      align-self: flex-end;
    }
    .btn-submit:hover { opacity: 0.85; }

    /* 最終輸出 */
    .final-output {
      background: rgba(72,187,120,0.08);
      border: 1px solid rgba(72,187,120,0.3);
      border-radius: 12px;
      padding: 20px;
    }
    .final-output .final-title {
      font-size: 13px;
      font-weight: 600;
      color: #48bb78;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .final-output .final-text {
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #e2e8f0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div>
    <div class="logo">🗺️ Taiwan Travel Agent</div>
    <div class="subtitle">LangGraph + FastAPI + Claude API</div>
  </div>
  <div class="badge">Multi-step AI Agent · HITL</div>
</header>

<!-- Main -->
<main>
  <!-- Left: Chat Panel -->
  <div class="chat-panel">
    <div class="chat-messages" id="chatMessages">
      <!-- 初始 Pipeline 狀態 -->
      <div class="pipeline-card" id="pipelineCard" style="display:none;">
        <div class="title">Agent Pipeline</div>
        <div class="pipeline-steps">
          <div class="step" id="step-intent_parser">
            <span class="icon">🧠</span>
            <span class="name">意圖解析</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-attraction_rag">
            <span class="icon">🏛️</span>
            <span class="name">景點檢索</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-food_rag">
            <span class="icon">🍜</span>
            <span class="name">美食檢索</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-transport">
            <span class="icon">🚇</span>
            <span class="name">交通建議</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-itinerary">
            <span class="icon">📋</span>
            <span class="name">行程整合</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-reviewer">
            <span class="icon">✋</span>
            <span class="name">HITL 審核</span>
            <span class="status-dot"></span>
          </div>
          <div class="step" id="step-final_output">
            <span class="icon">🎉</span>
            <span class="name">最終輸出</span>
            <span class="status-dot"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          placeholder="輸入你的旅遊需求，例如：我想去台北玩 2 天，喜歡老街跟小吃，預算 5000 元"
          rows="2"
        ></textarea>
        <button id="sendBtn" onclick="sendQuery()">
          &#9654;
        </button>
      </div>
    </div>
  </div>

  <!-- Right: Itinerary Panel -->
  <div class="itinerary-panel">
    <div class="panel-header">
      <h2>📍 行程規劃</h2>
      <span class="state-badge idle" id="stateBadge">等待中</span>
    </div>
    <div class="itinerary-content" id="itineraryContent">
      <!-- 空白初始狀態 -->
      <div class="empty-state" id="emptyState">
        <div class="big-icon">✈️</div>
        <p>在左側輸入你的旅遊需求，AI 將規劃專屬行程</p>
        <div class="example-queries">
          <div class="example-chip" onclick="fillExample(this)">
            我想去台北玩 2 天，喜歡老街跟小吃，預算 5000 元
          </div>
          <div class="example-chip" onclick="fillExample(this)">
            幫我規劃台南 3 天行程，喜歡歷史古蹟跟海鮮
          </div>
          <div class="example-chip" onclick="fillExample(this)">
            花蓮 2 天，想去太魯閣，有帶小孩
          </div>
        </div>
      </div>
      <!-- 動態內容注入點 -->
      <div class="draft-container" id="draftContainer" style="display:none;"></div>
    </div>
  </div>
</main>

<script>
  // ── 全域狀態 ──
  let threadId = null;
  let currentState = 'idle'; // idle | streaming | review | approved

  const STEP_NAMES = [
    'intent_parser', 'attraction_rag', 'food_rag',
    'transport', 'itinerary', 'reviewer', 'final_output'
  ];

  // ── 工具函式 ──
  function genThreadId() {
    return 'user-' + Math.random().toString(36).slice(2, 10);
  }

  function now() {
    return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  }

  function setState(s) {
    currentState = s;
    const badge = document.getElementById('stateBadge');
    const labels = { idle: '等待中', streaming: '生成中...', review: '等待審核', approved: '已完成' };
    badge.textContent = labels[s] || s;
    badge.className = 'state-badge ' + s;
  }

  function setStepStatus(node, status) {
    const el = document.getElementById('step-' + node);
    if (!el) return;
    el.className = 'step ' + status;
  }

  function resetPipeline() {
    STEP_NAMES.forEach(n => setStepStatus(n, ''));
  }

  // ── 訊息新增 ──
  function addMessage(role, text) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.innerHTML = `
      <div class="bubble">${text}</div>
      <div class="message-time">${now()}</div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  // ── 範例查詢 ──
  function fillExample(el) {
    document.getElementById('userInput').value = el.textContent.trim();
    document.getElementById('userInput').focus();
  }

  // ── 主送出邏輯 ──
  async function sendQuery() {
    const input = document.getElementById('userInput');
    const query = input.value.trim();
    if (!query || currentState !== 'idle') return;

    // 重設 UI
    threadId = genThreadId();
    input.value = '';
    setState('streaming');

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('draftContainer').style.display = 'flex';
    document.getElementById('draftContainer').innerHTML = '';
    document.getElementById('pipelineCard').style.display = 'block';
    document.getElementById('sendBtn').disabled = true;
    resetPipeline();

    addMessage('user', query);

    // 顯示 draft 佔位
    const draftBox = document.createElement('div');
    draftBox.className = 'draft-content';
    draftBox.id = 'draftText';
    draftBox.textContent = '🔄 Agent 執行中，請稍候...';
    document.getElementById('draftContainer').appendChild(draftBox);

    // SSE 串流
    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, thread_id: threadId }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop(); // 保留未完整的行

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw || raw === '[DONE]') continue;

          let evt;
          try { evt = JSON.parse(raw); } catch { continue; }

          handleSSEEvent(evt);
        }
      }
    } catch (err) {
      addMessage('assistant', '⚠️ 連線錯誤：' + err.message);
      setState('idle');
      document.getElementById('sendBtn').disabled = false;
    }
  }

  // ── SSE 事件處理 ──
  function handleSSEEvent(evt) {
    const type = evt.event || evt.type;

    if (type === 'node_complete') {
      setStepStatus(evt.node, 'done');
      const msgs = {
        intent_parser: '意圖解析完成',
        attraction_rag: `找到 ${evt.data?.count ?? ''} 筆景點資料`,
        food_rag: `找到 ${evt.data?.count ?? ''} 筆美食資料`,
        transport: '交通建議生成完成',
        itinerary: '行程草稿生成完成',
      };
      if (msgs[evt.node]) addMessage('assistant', msgs[evt.node]);
    }

    if (type === 'review_request') {
      setState('review');
      setStepStatus('reviewer', 'running');
      document.getElementById('draftText').textContent = evt.itinerary_draft || '';
      showReviewPanel(evt.thread_id || threadId);
    }

    if (type === 'final') {
      setState('approved');
      setStepStatus('reviewer', 'done');
      setStepStatus('final_output', 'done');
      showFinalOutput(evt.data || evt.final_output || '');
      document.getElementById('sendBtn').disabled = false;
    }

    if (type === 'error') {
      addMessage('assistant', '⚠️ 錯誤：' + (evt.detail || evt.message || '未知錯誤'));
      setState('idle');
      document.getElementById('sendBtn').disabled = false;
    }
  }

  // ── 顯示 HITL 審核面板 ──
  function showReviewPanel(tid) {
    const container = document.getElementById('draftContainer');

    const panel = document.createElement('div');
    panel.className = 'review-panel';
    panel.id = 'reviewPanel';
    panel.innerHTML = `
      <div class="review-title">✋ Human-in-the-Loop 審核</div>
      <div class="review-actions">
        <button class="btn btn-approve" onclick="submitFeedback('OK', '${tid}')">
          ✅ 核准行程
        </button>
        <button class="btn btn-modify" onclick="toggleFeedback()">
          ✏️ 要求修改
        </button>
      </div>
      <div class="feedback-area" id="feedbackArea">
        <textarea id="feedbackText" placeholder="說明你想修改的地方，例如：把第 2 天下午換成淡水老街"></textarea>
        <button class="btn btn-submit" onclick="submitModify('${tid}')">送出修改要求</button>
      </div>
    `;
    container.appendChild(panel);
    addMessage('assistant', '✋ 行程草稿已生成，請在右側審核並決定是否核准或修改。');
  }

  function toggleFeedback() {
    const area = document.getElementById('feedbackArea');
    area.classList.toggle('visible');
    if (area.classList.contains('visible')) {
      document.getElementById('feedbackText').focus();
    }
  }

  // ── 送出審核回饋 ──
  async function submitFeedback(feedback, tid) {
    const panel = document.getElementById('reviewPanel');
    if (panel) {
      panel.querySelector('.review-actions').innerHTML = '<span style="color:#a0aec0;font-size:13px;">處理中...</span>';
    }
    addMessage('user', feedback === 'OK' ? '✅ 核准行程' : '✏️ ' + feedback);

    try {
      const resp = await fetch('/chat/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: tid, feedback }),
      });
      const data = await resp.json();

      if (data.status === 'approved') {
        // 移除審核面板
        if (panel) panel.remove();
        showFinalOutput(data.final_output);
        setState('approved');
        setStepStatus('reviewer', 'done');
        setStepStatus('final_output', 'done');
        document.getElementById('sendBtn').disabled = false;
      } else if (data.status === 'revised') {
        // 更新草稿，重新顯示審核面板
        document.getElementById('draftText').textContent = data.itinerary_draft || '';
        if (panel) panel.remove();
        showReviewPanel(tid);
        setState('review');
        addMessage('assistant', '行程已修改，請重新審核。');
      }
    } catch (err) {
      addMessage('assistant', '⚠️ 送出失敗：' + err.message);
    }
  }

  async function submitModify(tid) {
    const text = document.getElementById('feedbackText').value.trim();
    if (!text) return;
    document.getElementById('feedbackText').value = '';
    document.getElementById('feedbackArea').classList.remove('visible');
    await submitFeedback(text, tid);
  }

  // ── 顯示最終輸出 ──
  function showFinalOutput(text) {
    const container = document.getElementById('draftContainer');
    // 移除舊 draft text
    const old = document.getElementById('draftText');
    if (old) old.remove();

    const box = document.createElement('div');
    box.className = 'final-output';
    box.innerHTML = `
      <div class="final-title">🎉 最終行程確認</div>
      <div class="final-text">${escapeHtml(text)}</div>
    `;
    container.insertBefore(box, container.firstChild);
    addMessage('assistant', '🎉 行程已確認！詳細內容請見右側面板。');

    // 新查詢提示
    setTimeout(() => {
      addMessage('assistant', '可以繼續輸入新的旅遊需求 ✈️');
      setState('idle');
    }, 1000);
  }

  function escapeHtml(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/\n/g, '<br>');
  }

  // ── Enter 送出 ──
  document.getElementById('userInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuery();
    }
  });

  // ── 自動 resize textarea ──
  document.getElementById('userInput').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
